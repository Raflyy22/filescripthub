<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CloudVault - Premium File Sharing</title>

  <!-- PWA Web App Meta Tags untuk HP -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020617">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons, Alpine.js, SweetAlert2 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    [x-cloak] { display: none !important; }
    .glass {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    /* SweetAlert Dark Theme Customization */
    .swal2-popup {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 1rem !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white" x-data="appData()" x-init="initApp()">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-40 glass border-b border-slate-800/80">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" @click="resetFilter()">
        <div class="p-2 bg-gradient-to-tr from-brand-600 to-indigo-500 rounded-xl shadow-lg shadow-brand-500/20">
          <i data-lucide="share-2" class="w-5 h-5 text-white"></i>
        </div>
        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">CloudVault</span>
      </div>

      <!-- Desktop Search Bar -->
      <div class="relative w-72 hidden md:block">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" x-model="searchQuery" placeholder="Cari file/aplikasi..." class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-brand-500 text-white placeholder-slate-500">
      </div>

      <!-- Secret Admin Trigger -->
      <button @click="toggleAdminModal()" class="p-2.5 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 transition-colors text-slate-400 hover:text-white">
        <i data-lucide="shield-check" :class="isAdmin ? 'text-brand-500' : ''" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Hero & Filter Bar -->
  <section class="max-w-6xl mx-auto px-4 pt-8 pb-4 text-center">
    <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs font-medium mb-3">
      <span class="flex h-2 w-2 rounded-full bg-brand-500 animate-pulse"></span>
      <span>Direct & Fast Cloud Server</span>
    </div>
    
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
      Pusat Download Aplikasi & File
    </h1>
    <p class="text-slate-400 max-w-lg mx-auto text-xs sm:text-sm mb-6">
      Unduh aplikasi dan file secara instan, aman, dan tanpa perlu mendaftar.
    </p>

    <!-- Mobile Search -->
    <div class="relative w-full md:hidden mb-5">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" x-model="searchQuery" placeholder="Cari nama aplikasi..." class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
    </div>

    <!-- Category Tabs -->
    <div class="flex items-center justify-center space-x-2 overflow-x-auto pb-2 scrollbar-none">
      <template x-for="cat in categories" :key="cat">
        <button @click="selectedCategory = cat" 
                :class="selectedCategory === cat ? 'bg-brand-600 text-white border-brand-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-white'"
                class="px-4 py-1.5 rounded-xl text-xs font-medium border transition-all whitespace-nowrap">
          <span x-text="cat"></span>
        </button>
      </template>
    </div>
  </section>

  <!-- Main App Grid -->
  <main class="max-w-6xl mx-auto px-4 pb-24">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <template x-for="item in filteredItems" :key="item.id">
        <div class="glass-card rounded-2xl p-5 hover:border-brand-500/40 transition-all duration-300 hover:-translate-y-1 flex flex-col justify-between group relative overflow-hidden">
          
          <div>
            <div class="flex items-start justify-between mb-3">
              <div class="p-3 bg-slate-800/80 rounded-xl border border-slate-700/50 group-hover:border-brand-500/30 group-hover:bg-brand-500/10 transition-colors">
                <i data-lucide="package" class="w-6 h-6 text-brand-500"></i>
              </div>
              <div class="flex items-center space-x-1.5">
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700" x-text="item.category || 'General'"></span>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-brand-500/10 text-brand-400 border border-brand-500/20" x-text="item.version"></span>
              </div>
            </div>

            <h3 class="font-bold text-base text-white mb-1.5 group-hover:text-brand-400 transition-colors" x-text="item.title"></h3>
            <p class="text-slate-400 text-xs line-clamp-2 mb-4 leading-relaxed" x-text="item.description"></p>
          </div>

          <div class="space-y-2 pt-3 border-t border-slate-800/80">
            <!-- Safelink Download Button -->
            <a :href="item.adLink" target="_blank" class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 transition-all shadow-md shadow-brand-600/20 active:scale-[0.98]">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              <span>Download (Safelink / Server 1)</span>
            </a>
            
            <!-- Direct Download Button -->
            <a :href="item.directLink" target="_blank" class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 transition-all border border-slate-800 active:scale-[0.98]">
              <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i>
              <span>Direct Link (Tanpa Iklan)</span>
            </a>

            <!-- Share & Admin Controls -->
            <div class="flex items-center space-x-2 pt-1">
              <button @click="copyShareLink(item)" class="flex-1 py-1.5 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg text-[11px] font-medium transition-colors border border-slate-800 flex items-center justify-center space-x-1">
                <i data-lucide="share-2" class="w-3 h-3"></i>
                <span>Bagikan</span>
              </button>
              
              <!-- Khusus Admin: Edit & Delete Button -->
              <template x-if="isAdmin">
                <div class="flex items-center space-x-1">
                  <button @click="openEditModal(item)" class="py-1.5 px-2.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 rounded-lg text-[11px] font-medium border border-amber-500/20">
                    Edit
                  </button>
                  <button @click="deleteItem(item.id)" class="py-1.5 px-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-[11px] font-medium border border-red-500/20">
                    Hapus
                  </button>
                </div>
              </template>
            </div>
          </div>

        </div>
      </template>
    </div>
  </main>

  <!-- Admin Floating Button -->
  <div x-show="isAdmin" class="fixed bottom-6 right-6 z-30" x-cloak>
    <button @click="openCreateModal()" class="p-4 bg-brand-600 text-white rounded-2xl shadow-2xl shadow-brand-500/40 hover:bg-brand-700 active:scale-95 transition-all flex items-center justify-center border border-brand-400/30">
      <i data-lucide="plus" class="w-6 h-6"></i>
    </button>
  </div>

  <!-- Modal Admin Auth -->
  <div x-show="showAuthModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
    <div class="glass max-w-sm w-full rounded-2xl p-6 border border-slate-800" @click.away="showAuthModal = false">
      <h2 class="text-lg font-bold mb-2 text-white">Login Admin Mode</h2>
      <p class="text-xs text-slate-400 mb-5">Masukkan GitHub Personal Access Token (PAT) Anda untuk aktivasi mode pengelolaan HP.</p>
      
      <form @submit.prevent="saveAdminToken()">
        <div class="mb-4">
          <label class="block text-[11px] font-medium text-slate-300 mb-1">GitHub Token (PAT)</label>
          <input type="password" x-model="inputToken" required placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
        </div>
        
        <div class="flex space-x-2">
          <button type="button" @click="showAuthModal = false" class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">Batal</button>
          <button type="submit" class="flex-1 py-2 bg-brand-600 text-white rounded-xl text-xs font-medium">Verifikasi</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Create / Edit File -->
  <div x-show="showFormModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
    <div class="glass max-w-lg w-full rounded-2xl p-6 border border-slate-800 max-h-[90vh] overflow-y-auto" @click.away="showFormModal = false">
      <h2 class="text-lg font-bold mb-4 text-white" x-text="isEditMode ? 'Edit Data File' : 'Tambah File Baru'"></h2>
      
      <form @submit.prevent="saveItem()" class="space-y-3.5">
        <div>
          <label class="block text-[11px] font-medium text-slate-300 mb-1">Nama Aplikasi / File</label>
          <input type="text" x-model="formData.title" required class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">Versi</label>
            <input type="text" x-model="formData.version" placeholder="v1.0.0" required class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">Kategori</label>
            <select x-model="formData.category" class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
              <option value="Apps">Apps</option>
              <option value="Games">Games</option>
              <option value="Tools">Tools</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-300 mb-1">Deskripsi Ringkas</label>
          <textarea x-model="formData.description" rows="2" required class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500"></textarea>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-300 mb-1">Link Download [IKLAN / Safelink]</label>
          <input type="url" x-model="formData.adLink" required class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-300 mb-1">Link Download [TANPA IKLAN / Direct]</label>
          <input type="url" x-model="formData.directLink" required class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
        </div>

        <div class="flex space-x-2 pt-3">
          <button type="button" @click="showFormModal = false" class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">Batal</button>
          <button type="submit" :disabled="loading" class="flex-1 py-2 bg-brand-600 text-white rounded-xl text-xs font-medium flex items-center justify-center">
            <span x-show="!loading">Simpan & Sync</span>
            <span x-show="loading" class="animate-spin text-xs">🌀 Synchronizing...</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Konfigurasi Repositori GitHub Anda
    const GITHUB_USER = "USERNAME_GITHUB_ANDA";
    const GITHUB_REPO = "NAMA_REPO_ANDA";
    const FILE_PATH = "database.json";

    function appData() {
      return {
        items: [],
        categories: ['Semua', 'Apps', 'Games', 'Tools', 'Other'],
        selectedCategory: 'Semua',
        searchQuery: '',
        isAdmin: false,
        showAuthModal: false,
        showFormModal: false,
        isEditMode: false,
        inputToken: '',
        ghToken: '',
        loading: false,
        formData: { id: '', title: '', version: '', category: 'Apps', description: '', adLink: '', directLink: '' },

        async initApp() {
          this.ghToken = localStorage.getItem('gh_admin_token') || '';
          if (this.ghToken) this.isAdmin = true;
          await this.fetchData();
        },

        async fetchData() {
          try {
            const res = await fetch(`database.json?cache=${Date.now()}`);
            this.items = await res.json();
            this.$nextTick(() => lucide.createIcons());
          } catch (e) {
            console.error("Gagal memuat file database JSON", e);
          }
        },

        get filteredItems() {
          return this.items.filter(item => {
            const matchesCategory = this.selectedCategory === 'Semua' || item.category === this.selectedCategory;
            const matchesSearch = item.title.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                 item.description.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
          });
        },

        resetFilter() {
          this.selectedCategory = 'Semua';
          this.searchQuery = '';
        },

        copyShareLink(item) {
          navigator.clipboard.writeText(item.adLink);
          Swal.fire({
            icon: 'success',
            title: 'Tautan Disalin!',
            text: `Link tautan '${item.title}' berhasil disalin ke clipboard.`,
            timer: 1500,
            showConfirmButton: false
          });
        },

        toggleAdminModal() {
          if (this.isAdmin) {
            Swal.fire({
              title: 'Keluar Mode Admin?',
              text: "Anda perlu memasukkan Token kembali untuk masuk ke dashboard admin.",
              icon: 'warning',
              showCancelButton: true,
              confirmButtonText: 'Ya, Logout',
              cancelButtonText: 'Batal'
            }).then((result) => {
              if (result.isConfirmed) {
                localStorage.removeItem('gh_admin_token');
                this.isAdmin = false;
                this.ghToken = '';
              }
            });
          } else {
            this.showAuthModal = true;
          }
        },

        saveAdminToken() {
          if (this.inputToken.trim()) {
            this.ghToken = this.inputToken.trim();
            localStorage.setItem('gh_admin_token', this.ghToken);
            this.isAdmin = true;
            this.showAuthModal = false;
            this.inputToken = '';
            Swal.fire({ icon: 'success', title: 'Login Admin Berhasil!', timer: 1500, showConfirmButton: false });
          }
        },

        openCreateModal() {
          this.isEditMode = false;
          this.formData = { id: '', title: '', version: '', category: 'Apps', description: '', adLink: '', directLink: '' };
          this.showFormModal = true;
        },

        openEditModal(item) {
          this.isEditMode = true;
          this.formData = { ...item };
          this.showFormModal = true;
        },

        async saveItem() {
          this.loading = true;
          let updatedItems = [];

          if (this.isEditMode) {
            // Update item yang sudah ada
            updatedItems = this.items.map(item => item.id === this.formData.id ? { ...this.formData } : item);
          } else {
            // Tambahkan item baru ke urutan teratas
            const newItemData = {
              id: 'app-' + Date.now(),
              ...this.formData
            };
            updatedItems = [newItemData, ...this.items];
          }

          const actionText = this.isEditMode ? `Update item: ${this.formData.title}` : `Add item: ${this.formData.title}`;
          const success = await this.commitToGitHub(updatedItems, actionText);

          if (success) {
            this.items = updatedItems;
            this.showFormModal = false;
            this.$nextTick(() => lucide.createIcons());
            Swal.fire({ icon: 'success', title: 'Berhasil Disimpan!', text: 'Data telah diperbarui di repository GitHub.', timer: 2000 });
          }
          this.loading = false;
        },

        async deleteItem(id) {
          Swal.fire({
            title: 'Hapus File Ini?',
            text: "Data yang dihapus tidak bisa dikembalikan!",
            icon: 'error',
            showCancelButton: true,
            confirmButtonText: 'Hapus',
            cancelButtonText: 'Batal'
          }).then(async (result) => {
            if (result.isConfirmed) {
              const updatedItems = this.items.filter(i => i.id !== id);
              const success = await this.commitToGitHub(updatedItems, `Delete item ID: ${id}`);
              if (success) {
                this.items = updatedItems;
                Swal.fire({ icon: 'success', title: 'Terhapus!', timer: 1500, showConfirmButton: false });
              }
            }
          });
        },

        async commitToGitHub(contentArray, commitMessage) {
          try {
            const getFileRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
              headers: { 'Authorization': `token ${this.ghToken}` }
            });
            
            if(!getFileRes.ok) throw new Error("Akses GitHub ditolak. Periksa Token Token Anda.");
            
            const fileData = await getFileRes.json();
            const sha = fileData.sha;
            const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(contentArray, null, 2))));
            
            const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
              method: 'PUT',
              headers: {
                'Authorization': `token ${this.ghToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: commitMessage,
                content: updatedContentBase64,
                sha: sha
              })
            });

            if (putRes.ok) return true;
            else {
              const err = await putRes.json();
              Swal.fire({ icon: 'error', title: 'Gagal Sync GitHub', text: err.message });
              return false;
            }
          } catch (e) {
            Swal.fire({ icon: 'error', title: 'Koneksi Error', text: e.message });
            return false;
          }
        }
      }
    }
  </script>
</body>
</html>
