<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CloudVault - Pusat Download File & Software</title>

  <!-- PWA & Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020617">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>
  
  <!-- CDN Libraries -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    [x-cloak] { display: none !important; }
    .glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.45);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .swal2-popup {
      background: #0f172a !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 1.25rem !important;
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white" x-data="appData()" x-init="initApp()">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 glass border-b border-slate-800/80">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" @click="goHome()">
        <div class="p-2.5 bg-gradient-to-tr from-brand-600 to-indigo-500 rounded-xl shadow-lg shadow-brand-500/20">
          <i data-lucide="cloud-download" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <span class="font-black text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">CloudVault</span>
          <span class="text-[10px] font-bold text-brand-400 ml-1.5 px-1.5 py-0.5 rounded bg-brand-500/10 border border-brand-500/20">V7</span>
        </div>
      </div>

      <!-- Search Bar Desktop -->
      <div class="relative w-72 hidden md:block">
        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" x-model="searchQuery" placeholder="Cari file atau aplikasi..." class="w-full pl-10 pr-4 py-2 bg-slate-900/80 border border-slate-800 rounded-xl text-xs focus:outline-none focus:border-brand-500 text-white placeholder-slate-500 transition-all">
      </div>

      <!-- Admin Actions -->
      <div class="flex items-center space-x-2">
        <template x-if="isAdmin">
          <button @click="openCategoryManager()" class="p-2 rounded-xl border border-slate-800 bg-slate-900/80 hover:bg-slate-800 text-xs text-brand-400 font-semibold flex items-center space-x-1.5">
            <i data-lucide="folder-cog" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Kelola Kategori</span>
          </button>
        </template>

        <button @click="toggleAdminModal()" class="p-2.5 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 transition-colors text-slate-400 hover:text-white flex items-center space-x-2">
          <i data-lucide="shield-check" :class="isAdmin ? 'text-brand-500' : ''" class="w-5 h-5"></i>
          <span class="text-xs font-semibold hidden sm:inline" x-text="isAdmin ? 'Admin Active' : 'Login'"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="max-w-6xl mx-auto px-4 pt-8 pb-4">
    <div class="text-center mb-6">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
        Pusat File & Software Terintegrasi
      </h1>
      <p class="text-slate-400 max-w-lg mx-auto text-xs sm:text-sm">
        Unduh file favorit Anda atau bagikan link unduhan dengan mudah.
      </p>
    </div>

    <!-- Search Mobile -->
    <div class="relative w-full md:hidden mb-4">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" x-model="searchQuery" placeholder="Cari file..." class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
    </div>

    <!-- Category Tabs & Sort Controls -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
      <div class="flex items-center space-x-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0 scrollbar-none">
        <button @click="selectedCategory = 'Semua'" 
                :class="selectedCategory === 'Semua' ? 'bg-brand-600 text-white border-brand-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-white'"
                class="px-3.5 py-1.5 rounded-xl text-xs font-medium border transition-all whitespace-nowrap">
          Semua
        </button>
        <template x-for="cat in categories" :key="cat">
          <button @click="selectedCategory = cat" 
                  :class="selectedCategory === cat ? 'bg-brand-600 text-white border-brand-500' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-white'"
                  class="px-3.5 py-1.5 rounded-xl text-xs font-medium border transition-all whitespace-nowrap">
            <span x-text="cat"></span>
          </button>
        </template>
      </div>

      <div class="flex items-center space-x-2 self-end sm:self-auto">
        <span class="text-slate-400 text-[11px]">Urutan:</span>
        <select x-model="sortBy" class="bg-slate-900 border border-slate-800 text-slate-300 rounded-xl text-xs px-3 py-1.5 focus:outline-none focus:border-brand-500">
          <option value="newest">Terbaru</option>
          <option value="popular">Terpopuler</option>
          <option value="alphabet">Nama (A-Z)</option>
        </select>
      </div>
    </div>
  </section>

  <!-- Items Grid -->
  <main class="max-w-6xl mx-auto px-4 pb-24">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <template x-for="item in filteredItems" :key="item.id">
        <div class="glass-card rounded-2xl p-5 hover:border-brand-500/40 transition-all duration-300 hover:-translate-y-1 flex flex-col justify-between group relative overflow-hidden">
          
          <div>
            <div class="flex items-start justify-between mb-3">
              <div class="p-3 bg-slate-800/80 rounded-xl border border-slate-700/50 group-hover:border-brand-500/30 group-hover:bg-brand-500/10 transition-colors">
                <i data-lucide="package" class="w-6 h-6 text-brand-500"></i>
              </div>
              <div class="flex items-center space-x-1.5">
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700" x-text="item.category || 'General'"></span>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-brand-500/10 text-brand-400 border border-brand-500/20" x-text="item.version"></span>
              </div>
            </div>

            <h3 class="font-bold text-base text-white mb-1 group-hover:text-brand-400 transition-colors cursor-pointer" @click="openPostModal(item)" x-text="item.title"></h3>
            <p class="text-slate-400 text-xs line-clamp-2 mb-3 leading-relaxed" x-text="item.description"></p>

            <div class="flex items-center justify-between text-[11px] text-slate-500 mb-4 pb-3 border-b border-slate-800/60">
              <span class="flex items-center space-x-1"><i data-lucide="hard-drive" class="w-3 h-3"></i> <span x-text="item.fileSize || 'N/A'"></span></span>
              <span class="flex items-center space-x-1"><i data-lucide="download-cloud" class="w-3 h-3"></i> <span x-text="(item.downloads || 0) + 'x'"></span></span>
              <span class="flex items-center space-x-1"><i data-lucide="calendar" class="w-3 h-3"></i> <span x-text="item.createdAt || 'Baru'"></span></span>
            </div>
          </div>

          <div class="space-y-2">
            <button @click="openPostModal(item)" class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 transition-all active:scale-[0.98]">
              <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              <span>Detail & Download</span>
            </button>

            <div class="flex items-center space-x-2 pt-1">
              <button @click="copyPostLink(item)" class="flex-1 py-1.5 bg-slate-900/60 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg text-[11px] font-medium transition-colors border border-slate-800 flex items-center justify-center space-x-1">
                <i data-lucide="link" class="w-3 h-3"></i>
                <span>Salin Link Post</span>
              </button>
              
              <template x-if="isAdmin">
                <div class="flex items-center space-x-1">
                  <button @click="openEditModal(item)" class="py-1.5 px-2.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 rounded-lg text-[11px] font-medium border border-amber-500/20">Edit</button>
                  <button @click="deleteItem(item.id)" class="py-1.5 px-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-lg text-[11px] font-medium border border-red-500/20">Hapus</button>
                </div>
              </template>
            </div>
          </div>

        </div>
      </template>
    </div>
  </main>

  <!-- Single Post Detail Modal -->
  <div x-show="showPostModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
    <div class="glass max-w-lg w-full rounded-2xl p-6 border border-slate-800 relative max-h-[90vh] overflow-y-auto" @click.away="closePostModal()">
      <button @click="closePostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <template x-if="activeItem">
        <div>
          <div class="flex items-center space-x-2 mb-3">
            <span class="text-[10px] font-bold px-2.5 py-1 rounded-md bg-brand-500/20 text-brand-400 border border-brand-500/30" x-text="activeItem.category"></span>
            <span class="text-[10px] font-bold px-2.5 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700" x-text="activeItem.version"></span>
          </div>

          <h2 class="text-xl font-bold text-white mb-2" x-text="activeItem.title"></h2>
          <p class="text-slate-300 text-xs leading-relaxed mb-6 bg-slate-900/60 p-3.5 rounded-xl border border-slate-800" x-text="activeItem.description"></p>

          <div class="grid grid-cols-3 gap-2 text-center mb-6">
            <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
              <span class="block text-[10px] text-slate-500">Ukuran</span>
              <span class="text-xs font-semibold text-slate-200" x-text="activeItem.fileSize"></span>
            </div>
            <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
              <span class="block text-[10px] text-slate-500">Unduhan</span>
              <span class="text-xs font-semibold text-brand-400" x-text="(activeItem.downloads || 0) + 'x'"></span>
            </div>
            <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
              <span class="block text-[10px] text-slate-500">Tanggal</span>
              <span class="text-xs font-semibold text-slate-200" x-text="activeItem.createdAt"></span>
            </div>
          </div>

          <!-- Dynamic Download Links -->
          <div class="space-y-2.5">
            <template x-for="(link, idx) in (activeItem.links || [])" :key="idx">
              <a :href="link.url" target="_blank" @click="incrementDownload(activeItem)" 
                 :class="link.isAd ? 'bg-brand-600 hover:bg-brand-700 text-white shadow-lg shadow-brand-600/20' : 'bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800'"
                 class="w-full py-3 px-4 rounded-xl text-xs font-bold flex items-center justify-between transition-all">
                <div class="flex items-center space-x-2">
                  <i :data-lucide="link.isAd ? 'download' : 'zap'" :class="link.isAd ? '' : 'text-amber-400'" class="w-4 h-4"></i>
                  <span x-text="link.label || 'Download'"></span>
                </div>
                <span class="text-[10px] px-2 py-0.5 rounded bg-black/20" x-text="link.isAd ? 'Safelink' : 'Direct'"></span>
              </a>
            </template>

            <button @click="copyPostLink(activeItem)" class="w-full py-2.5 px-4 bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 mt-4">
              <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
              <span>Bagikan Link Post Ini</span>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Admin Category Manager Modal -->
  <div x-show="showCategoryModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
    <div class="glass max-w-md w-full rounded-2xl p-6 border border-slate-800" @click.away="showCategoryModal = false">
      <h2 class="text-lg font-bold mb-3 text-white flex items-center space-x-2">
        <i data-lucide="folder-cog" class="w-5 h-5 text-brand-500"></i>
        <span>Kelola Kategori</span>
      </h2>

      <!-- Tambah Kategori -->
      <div class="flex space-x-2 mb-4">
        <input type="text" x-model="newCategoryInput" placeholder="Nama Kategori Baru..." class="flex-1 px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
        <button @click="addCategory()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold">Tambah</button>
      </div>

      <!-- List Kategori -->
      <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
        <template x-for="(cat, idx) in categories" :key="idx">
          <div class="flex items-center justify-between p-2.5 bg-slate-900/80 rounded-xl border border-slate-800 text-xs">
            <span x-text="cat" class="font-medium text-slate-200"></span>
            <div class="flex items-center space-x-1">
              <button @click="editCategoryPrompt(idx)" class="px-2 py-1 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 rounded-md text-[10px]">Edit</button>
              <button @click="deleteCategory(idx)" class="px-2 py-1 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-md text-[10px]">Hapus</button>
            </div>
          </div>
        </template>
      </div>

      <div class="mt-5 pt-3 border-t border-slate-800 flex justify-end">
        <button @click="showCategoryModal = false" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Create/Edit Form Modal -->
  <div x-show="showFormModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
    <div class="glass max-w-xl w-full rounded-2xl p-6 border border-slate-800 max-h-[90vh] overflow-y-auto" @click.away="showFormModal = false">
      <h2 class="text-lg font-bold mb-4 text-white" x-text="isEditMode ? 'Edit Data File' : 'Tambah File Baru'"></h2>
      
      <form @submit.prevent="saveItem()" class="space-y-3">
        <div>
          <label class="block text-[11px] font-medium text-slate-300 mb-1">Nama File / Aplikasi</label>
          <input type="text" x-model="formData.title" @input="generateSlug()" required class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-300 mb-1">Custom Post Route (Slug URL)</label>
          <input type="text" x-model="formData.slug" required class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-brand-400 focus:outline-none focus:border-brand-500 font-mono">
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">Versi</label>
            <input type="text" x-model="formData.version" placeholder="v1.0.0" required class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">Ukuran File</label>
            <input type="text" x-model="formData.fileSize" placeholder="15 MB" required class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-slate-300 mb-1">Kategori</label>
            <select x-model="formData.category" class="w-full px-2 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
              <template x-for="cat in categories" :key="cat">
                <option :value="cat" x-text="cat"></option>
              </template>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-slate-300 mb-1">Deskripsi Ringkas</label>
          <textarea x-model="formData.description" rows="2" required class="w-full px-3.5 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500"></textarea>
        </div>

        <!-- Section Link Unduhan Dinamis (Tambah / Hapus Link Manual) -->
        <div class="pt-2">
          <div class="flex items-center justify-between mb-2">
            <label class="block text-[11px] font-bold text-slate-200">Daftar Link Unduhan</label>
            <button type="button" @click="addDownloadLinkField()" class="text-[11px] font-semibold text-brand-400 hover:text-brand-300 flex items-center space-x-1">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
              <span>Tambah Link</span>
            </button>
          </div>

          <div class="space-y-2.5">
            <template x-for="(link, idx) in formData.links" :key="idx">
              <div class="p-3 bg-slate-900/90 rounded-xl border border-slate-800 space-y-2 relative">
                <button type="button" @click="removeDownloadLinkField(idx)" class="absolute top-2 right-2 text-red-400 hover:text-red-300 p-1">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>

                <div class="grid grid-cols-2 gap-2 pr-6">
                  <input type="text" x-model="link.label" placeholder="Nama Label Link (misal: Server 1)" required class="px-2.5 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none">
                  <select x-model="link.isAd" class="px-2 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none">
                    <option :value="true">Server Iklan (Safelink)</option>
                    <option :value="false">Direct (Tanpa Iklan)</option>
                  </select>
                </div>
                <input type="url" x-model="link.url" placeholder="https://..." required class="w-full px-2.5 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none">
              </div>
            </template>
          </div>
        </div>

        <div class="flex space-x-2 pt-3">
          <button type="button" @click="showFormModal = false" class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">Batal</button>
          <button type="submit" :disabled="loading" class="flex-1 py-2 bg-brand-600 text-white rounded-xl text-xs font-medium flex items-center justify-center">
            <span x-show="!loading">Simpan & Sync</span>
            <span x-show="loading" class="animate-spin text-xs">🌀</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin Auth Modal -->
  <div x-show="showAuthModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4" x-cloak>
    <div class="glass max-w-sm w-full rounded-2xl p-6 border border-slate-800" @click.away="showAuthModal = false">
      <h2 class="text-lg font-bold mb-1 text-white">Login Admin</h2>
      <p class="text-xs text-slate-400 mb-4">Masukkan GitHub Personal Access Token Anda.</p>
      
      <form @submit.prevent="verifyAndSaveToken()">
        <input type="password" x-model="inputToken" required placeholder="ghp_xxxxxxxxxxxx" class="w-full px-3.5 py-2 mb-4 bg-slate-900 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-brand-500">
        <div class="flex space-x-2">
          <button type="button" @click="showAuthModal = false" class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-medium">Batal</button>
          <button type="submit" class="flex-1 py-2 bg-brand-600 text-white rounded-xl text-xs font-medium">Verifikasi</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Floating Add Button -->
  <div x-show="isAdmin" class="fixed bottom-6 right-6 z-30" x-cloak>
    <button @click="openCreateModal()" class="p-4 bg-brand-600 text-white rounded-2xl shadow-2xl shadow-brand-500/40 hover:bg-brand-700 active:scale-95 transition-all flex items-center justify-center border border-brand-400/30">
      <i data-lucide="plus" class="w-6 h-6"></i>
    </button>
  </div>

  <script>
    const GITHUB_USER = "USERNAME_GITHUB_ANDA";
    const GITHUB_REPO = "NAMA_REPO_ANDA";
    const FILE_PATH = "database.json";

    function appData() {
      return {
        items: [],
        categories: [],
        selectedCategory: 'Semua',
        searchQuery: '',
        sortBy: 'newest',
        isAdmin: false,
        showAuthModal: false,
        showFormModal: false,
        showPostModal: false,
        showCategoryModal: false,
        activeItem: null,
        isEditMode: false,
        inputToken: '',
        ghToken: '',
        newCategoryInput: '',
        loading: false,
        formData: { id: '', slug: '', title: '', version: '', category: 'Tools', fileSize: '', description: '', links: [] },

        async initApp() {
          this.ghToken = localStorage.getItem('gh_admin_token') || '';
          if (this.ghToken) this.isAdmin = true;
          await this.fetchData();

          this.handleRouting();
          window.addEventListener('popstate', () => this.handleRouting());
        },

        async fetchData() {
          try {
            const res = await fetch(`database.json?cache=${Date.now()}`);
            const data = await res.json();
            
            // Retro-compatibility check
            if (Array.isArray(data)) {
              this.items = data;
              this.categories = ['Apps', 'Games', 'Tools', 'Other'];
            } else {
              this.items = data.items || [];
              this.categories = data.categories || ['Apps', 'Games', 'Tools', 'Other'];
            }

            this.$nextTick(() => lucide.createIcons());
          } catch (e) {
            console.error("Gagal memuat file database JSON", e);
          }
        },

        handleRouting() {
          const path = window.location.pathname;
          if (path.startsWith('/post/')) {
            const slug = path.split('/post/')[1];
            const found = this.items.find(i => i.slug === slug || i.id === slug);
            if (found) {
              this.activeItem = found;
              this.showPostModal = true;
              document.title = `${found.title} - Download CloudVault`;
            } else {
              this.goHome();
            }
          } else {
            document.title = "CloudVault - Pusat Download File & Software";
          }
        },

        openPostModal(item) {
          this.activeItem = item;
          this.showPostModal = true;
          document.title = `${item.title} - Download CloudVault`;
          window.history.pushState({}, '', `/post/${item.slug || item.id}`);
          this.$nextTick(() => lucide.createIcons());
        },

        closePostModal() {
          this.showPostModal = false;
          this.activeItem = null;
          document.title = "CloudVault - Pusat Download File & Software";
          window.history.pushState({}, '', '/');
        },

        goHome() {
          this.closePostModal();
          this.selectedCategory = 'Semua';
          this.searchQuery = '';
        },

        copyPostLink(item) {
          const fullUrl = `${window.location.origin}/post/${item.slug || item.id}`;
          navigator.clipboard.writeText(fullUrl);
          Swal.fire({
            icon: 'success',
            title: 'Tautan Post Disalin!',
            text: fullUrl,
            timer: 2000,
            showConfirmButton: false
          });
        },

        generateSlug() {
          if (!this.isEditMode) {
            this.formData.slug = this.formData.title
              .toLowerCase()
              .replace(/[^a-z0-9]/g, '');
          }
        },

        // --- Category Management ---
        openCategoryManager() {
          this.showCategoryModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async addCategory() {
          const cat = this.newCategoryInput.trim();
          if (cat && !this.categories.includes(cat)) {
            this.categories.push(cat);
            this.newCategoryInput = '';
            await this.saveDatabase();
          }
        },

        async editCategoryPrompt(index) {
          const oldCat = this.categories[index];
          const { value: newCat } = await Swal.fire({
            title: 'Edit Nama Kategori',
            input: 'text',
            inputValue: oldCat,
            showCancelButton: true
          });

          if (newCat && newCat.trim() !== '') {
            this.categories[index] = newCat.trim();
            // Update items with old category
            this.items.forEach(i => { if (i.category === oldCat) i.category = newCat.trim(); });
            await this.saveDatabase();
          }
        },

        async deleteCategory(index) {
          const catName = this.categories[index];
          Swal.fire({
            title: `Hapus Kategori ${catName}?`,
            text: "Kategori akan dihapus dari daftar.",
            icon: 'warning',
            showCancelButton: true
          }).then(async (res) => {
            if (res.isConfirmed) {
              this.categories.splice(index, 1);
              await this.saveDatabase();
            }
          });
        },

        // --- Download Links Dynamic Management ---
        addDownloadLinkField() {
          this.formData.links.push({ label: 'Server Download', url: '', isAd: true });
          this.$nextTick(() => lucide.createIcons());
        },

        removeDownloadLinkField(index) {
          this.formData.links.splice(index, 1);
        },

        get filteredItems() {
          let list = this.items.filter(item => {
            const matchesCategory = this.selectedCategory === 'Semua' || item.category === this.selectedCategory;
            const matchesSearch = item.title.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                                 item.description.toLowerCase().includes(this.searchQuery.toLowerCase());
            return matchesCategory && matchesSearch;
          });

          if (this.sortBy === 'alphabet') {
            return list.sort((a, b) => a.title.localeCompare(b.title));
          } else if (this.sortBy === 'popular') {
            return list.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
          } else {
            return list.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          }
        },

        incrementDownload(item) {
          item.downloads = (item.downloads || 0) + 1;
        },

        toggleAdminModal() {
          if (this.isAdmin) {
            localStorage.removeItem('gh_admin_token');
            this.isAdmin = false;
            this.ghToken = '';
            Swal.fire({ icon: 'info', title: 'Logout Admin', timer: 1500, showConfirmButton: false });
          } else {
            this.showAuthModal = true;
          }
        },

        verifyAndSaveToken() {
          if (this.inputToken.trim()) {
            this.ghToken = this.inputToken.trim();
            localStorage.setItem('gh_admin_token', this.ghToken);
            this.isAdmin = true;
            this.showAuthModal = false;
            this.inputToken = '';
            Swal.fire({ icon: 'success', title: 'Mode Admin Aktif!', timer: 1500, showConfirmButton: false });
          }
        },

        openCreateModal() {
          this.isEditMode = false;
          this.formData = {
            id: '',
            slug: '',
            title: '',
            version: '',
            category: this.categories[0] || 'Tools',
            fileSize: '',
            description: '',
            links: [
              { label: 'Download Server 1 (Safelink)', url: '', isAd: true },
              { label: 'Direct Fast Download (Tanpa Iklan)', url: '', isAd: false }
            ]
          };
          this.showFormModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        openEditModal(item) {
          this.isEditMode = true;
          // Migrasi data lama jika masih menggunakan format adLink/directLink
          let itemLinks = item.links || [];
          if (itemLinks.length === 0) {
            if (item.adLink) itemLinks.push({ label: 'Download Server 1 (Safelink)', url: item.adLink, isAd: true });
            if (item.directLink) itemLinks.push({ label: 'Direct Fast Download', url: item.directLink, isAd: false });
          }

          this.formData = { ...item, links: JSON.parse(JSON.stringify(itemLinks)) };
          this.showFormModal = true;
          this.$nextTick(() => lucide.createIcons());
        },

        async saveItem() {
          this.loading = true;
          const currentDate = new Date().toISOString().split('T')[0];

          if (this.isEditMode) {
            this.items = this.items.map(item => item.id === this.formData.id ? { ...this.formData } : item);
          } else {
            const newItemData = {
              id: 'file-' + Date.now(),
              ...this.formData,
              downloads: 0,
              createdAt: currentDate
            };
            this.items.unshift(newItemData);
          }

          const success = await this.saveDatabase();

          if (success) {
            this.showFormModal = false;
            this.$nextTick(() => lucide.createIcons());
            Swal.fire({ icon: 'success', title: 'Berhasil Disimpan!', timer: 2000, showConfirmButton: false });
          }
          this.loading = false;
        },

        async deleteItem(id) {
          Swal.fire({
            title: 'Hapus File Ini?',
            text: "Data yang dihapus tidak dapat dikembalikan!",
            icon: 'error',
            showCancelButton: true,
            confirmButtonText: 'Hapus'
          }).then(async (result) => {
            if (result.isConfirmed) {
              this.items = this.items.filter(i => i.id !== id);
              const success = await this.saveDatabase();
              if (success) {
                Swal.fire({ icon: 'success', title: 'Terhapus!', timer: 1500, showConfirmButton: false });
              }
            }
          });
        },

        async saveDatabase() {
          const fullData = {
            categories: this.categories,
            items: this.items
          };
          return await this.commitToGitHub(fullData, "Update CloudVault Database");
        },

        async commitToGitHub(fullDataObject, commitMessage) {
          try {
            const getFileRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
              headers: { 'Authorization': `token ${this.ghToken}` }
            });
            if(!getFileRes.ok) throw new Error("Akses GitHub ditolak. Cek kembali Token.");
            
            const fileData = await getFileRes.json();
            const sha = fileData.sha;
            const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(fullDataObject, null, 2))));
            
            const putRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
              method: 'PUT',
              headers: {
                'Authorization': `token ${this.ghToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ message: commitMessage, content: updatedContentBase64, sha: sha })
            });

            return putRes.ok;
          } catch (e) {
            Swal.fire({ icon: 'error', title: 'Error GitHub API', text: e.message });
            return false;
          }
        }
      }
    }
  </script>
</body>
</html>
